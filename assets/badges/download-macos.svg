<!--
  README download button — macOS. See download-windows.svg for why these are self-hosted, why neither
  half says "Download", and why textLength is load-bearing.

  "APP" rather than "INSTALLER" is accurate, not vague: macOS ships no installer on purpose (a .pkg
  would need a password for every update), so the download IS the .app — see the Install section.

  The apple's scale is NOT the flag's. Both glyphs occupy the same 14x14 slot, but the flag's ink
  centroid sits at y=12.01 of its 24-unit box while the apple's is at y=14.10 — bottom-heavy, because
  the leaf is thin and the body is not — so drawn at the same scale the apple reads ~1.2px low beside
  it. Scaling the apple by 14/28.2 instead of 14/24 puts its centroid exactly on the slot's centre,
  and 28.2 is the largest divisor that does so without clipping the leaf. The x offset then re-centres
  the narrower glyph in the slot. Measured, not eyeballed: if you swap either glyph, re-measure rather
  than assuming the numbers still hold.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="208.5" height="28" role="img"
     aria-label="Download Hoard for macOS: app, Apple Silicon">
  <title>Download Hoard for macOS: app, Apple Silicon</title>
  <rect width="208.5" height="28" fill="#6d6df5" shape-rendering="crispEdges"/>
  <g transform="translate(10.0425 7) scale(.4964539)">
