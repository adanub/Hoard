name: Release

# Versioning is automated from Conventional Commits; the MERGE of the release PR is the release
# decision. One manual lever, pulled once per release:
#  1. When you're getting ready to ship, run this workflow manually ("Run workflow"). release-please
#     computes the next semver from the commit types since the last release (feat → minor, fix/perf →
#     patch, feat!/BREAKING CHANGE → major) and opens or refreshes the release PR with the version bump
#     + CHANGELOG.md. Nothing release-related runs on ordinary pushes — the PR only needs to be current
#     once, right before it's merged, so refreshing it per-push would just spend runner minutes.
#  2. Merging that PR IS the release. The merge's push to main is recognised by its commit message
#     (job-level `if`, below); release-please tags vX.Y.Z + creates the GitHub Release, and the build
#     matrix packages the Windows x64 and Apple Silicon apps and uploads them (with checksums + build
#     provenance) to it — all automatically. Every other push to main skips at the `if`, which costs
#     zero runner minutes (a skipped job never starts a runner; only a grey "skipped" run entry
#     appears in the Actions tab).
#  CAVEAT the trigger depends on: the merge must keep its default commit message (auto-generated
#  "Merge pull request … from …/release-please--branches--main", or the PR title for a squash). If the
#  message is hand-edited so neither marker survives, the release leg won't fire for that merge.
#
# The build jobs chain off the release job (needs:) rather than triggering on the release event,
# because events created with the workflow's own token never start other workflows.
#
# A manual run with dry_run = true is a packaging dry run: build matrix only, artifacts only —
# no PR refresh, no release — so packaging changes can be tested without touching versioning.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Packaging dry run: build the apps as workflow artifacts only. Off = open/refresh the release PR."
        type: boolean
        default: false

# Least privilege by default; each job asks for exactly what it needs.
permissions: {}

# Never run two release flows at once, and never cancel one mid-release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Manual leg: open/refresh the release PR. skip-github-release means this can NEVER create a
  # release, whatever state it finds — it only proposes.
  release-pr:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the release branch
      pull-requests: write   # open/refresh the release PR
      issues: write          # the "autorelease: pending" label rides the issues API
    steps:
      - name: Open or refresh the release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Falls back to the built-in GITHUB_TOKEN, so this is inert until a RELEASE_PLEASE_TOKEN secret
          # exists. Adding one buys two things: it survives an org/repo policy that caps GITHUB_TOKEN, and
          # events it raises DO start other workflows — which is what gets CI to run on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # Automatic leg: fires only for the push that merges the release PR (see the message test), finds the
  # merged PR by its "autorelease: pending" label, and turns it into the vX.Y.Z tag + GitHub Release.
  # skip-github-pull-request means it never touches the PR itself.
  release:
    if: >-
      github.event_name == 'push' &&
      (contains(github.event.head_commit.message, 'release-please--branches--main') ||
       startsWith(github.event.head_commit.message, 'chore(main): release'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the tag + release
      pull-requests: write   # release-please updates the merged PR's state
      issues: write          # flip "autorelease: pending" → "autorelease: tagged" (labels = issues API)
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      gallery_dl_tag: ${{ steps.gdl.outputs.tag }}
    steps:
      - name: Create the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # "Latest" is resolved to a concrete gdl-org/builds tag exactly ONCE per release, here, and both
      # build legs download that tag — resolving per-leg would let an upstream release landing mid-run
      # ship two different gallery-dl builds under one Hoard version. The redirect (not the API) keeps
      # this off the unauthenticated rate limit, same as the fetch script itself.
      - name: Resolve the gallery-dl build to bundle
        id: gdl
        if: steps.release.outputs.release_created == 'true'
        shell: bash
        run: |
          tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/gdl-org/builds/releases/latest | sed 's#.*/tag/##')
          [[ -n "$tag" && "$tag" != *"://"* ]] || { echo "could not resolve a gallery-dl tag (got '$tag')"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Bundling gallery-dl build \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      # Answerable later without an affected user's About sheet: which gallery-dl did vX.Y.Z ship?
      - name: Record the bundled gallery-dl in the release notes
        if: steps.release.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          GDL_TAG: ${{ steps.gdl.outputs.tag }}
        run: |
          body=$(gh release view "$TAG_NAME" --json body -q .body)
          gh release edit "$TAG_NAME" --notes "$body

          Bundled gallery-dl: [$GDL_TAG](https://github.com/gdl-org/builds/releases/tag/$GDL_TAG)"

  build:
    needs: release
    # Two ways in: a release was just created (upload to it), or an explicit dry run (artifacts only).
    # The !cancelled() is load-bearing: on a dry-run dispatch the `release` job is SKIPPED, and a
    # skipped dependency skips dependants too unless their condition opts out of that default.
    # A failed `release` job still blocks the build (release_created stays empty).
    if: >-
      !cancelled() &&
      (needs.release.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    strategy:
      fail-fast: false
      # Supported targets: Windows x64 and Apple Silicon. Intel macs (osx-x64) are deliberately NOT
      # released. Each RID is published on a runner of its own OS, which is what lets the packaging steps
      # and the gallery-dl fetch below pick the right per-OS binary by runner rather than by RID.
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write        # upload assets to the release
      id-token: write        # sign the provenance attestation
      attestations: write    # store the provenance attestation
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      GDL_TAG: ${{ needs.release.outputs.gallery_dl_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the released commit; empty ref = default branch on dry runs.
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Work out version
        shell: bash
        run: |
          if [[ -n "$TAG" ]]; then
            echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # A dry run dispatched ON a tag (gh workflow run release.yml --ref vX.Y.Z -f dry_run=true)
            # rebuilds that release's assets with its real version — the checkout above lands on the
            # tag's commit automatically (empty ref = the SHA that triggered the run). This is how the
            # zips of an existing release are remade, e.g. after a failed upload.
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # Latest-at-release on purpose — Pinterest changes break old gallery-dl builds, and pinning
      # wouldn't make users any fresher: the zip freezes a version either way, a pin just adds a bump
      # chore that ships STALE binaries when neglected. But "latest" here is the ONE tag the release job
      # resolved, so both OS legs of a release bundle the identical build. Only a dry run (no release
      # job, GDL_TAG empty) falls back to whatever is latest at that moment.
      - name: Fetch gallery-dl
        shell: pwsh
        run: ./tools/fetch-gallery-dl.ps1 -Tag $env:GDL_TAG

      # A binary that can't even print its version must not ship — a torn download or a broken upstream
      # build would otherwise be discovered by some user's first import. Also puts the self-reported
      # version next to the resolved tag in the run summary.
      - name: Smoke-test gallery-dl
        shell: bash
        run: |
          exe=tools/gallery-dl/gallery-dl
          [[ "$RUNNER_OS" == "Windows" ]] && exe+=".exe"
          v=$("$exe" --version)
          echo "gallery-dl --version → \`$v\` (${{ matrix.rid }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Hoard.Desktop/Hoard.Desktop.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:Version="$VERSION" \
            -p:DebugType=embedded \
            --output publish

      # Hoard is GPL-3.0 and ships the GPL-2.0 gallery-dl binary alongside itself, so both licences have
      # to travel with the archive — a release that omits them is a licence breach, not a tidiness issue.
      # The licence text is pinned to a commit (the file hasn't changed since gallery-dl's 2014 initial
      # commit, and GPL-2.0's text is immutable) — fetching a branch here would mean an upstream licence
      # CHANGE silently propagates into our zips, which is exactly the kind of thing that shouldn't
      # happen unreviewed. THIRD-PARTY-NOTICES.md points here by name; keep them in step if paths change.
      - name: Collect licences
        shell: bash
        run: |
          mkdir -p publish/licences
          cp LICENSE publish/licences/Hoard-LICENSE.txt
          cp THIRD-PARTY-NOTICES.md publish/licences/THIRD-PARTY-NOTICES.md
          curl -fsSL --retry 3 -o publish/licences/gallery-dl-LICENSE.txt \
            https://raw.githubusercontent.com/mikf/gallery-dl/d2c6b7298c9cccb21d421784df58131b3b48a391/LICENSE
          # Velopack (MIT) — its managed assembly ships in every build and its native Setup/Update binaries
          # ship inside the Windows installer, so the notice travels with both. Pinned to the 1.2.0 tag's
          # commit for the same reason as gallery-dl's: an upstream licence change must not reach a release
          # unreviewed. Bump this alongside the vpk tool + PackageReference versions.
          curl -fsSL --retry 3 -o publish/licences/velopack-LICENSE.txt \
            https://raw.githubusercontent.com/velopack/velopack/f2edcbcafb81da5b3c884aaea330e225ad91d8b6/LICENSE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Move-Item publish out/Hoard
          Compress-Archive -Path out/Hoard -DestinationPath "Hoard-$env:VERSION-${{ matrix.rid }}.zip"

      # ── Self-updating installer (Velopack) ─────────────────────────────────────────────────────────
      # ADDITIVE: the portable zip above is untouched, so anyone who prefers unzipping still can. Setup.exe
      # is the one that installs per-user (no admin prompt) and can auto-update itself afterwards.
      #
      # WINDOWS ONLY, deliberately. The macOS leg keeps its hand-rolled ad-hoc-signed .app zip: packing that
      # with Velopack is unverified here (no Mac to test on), and on Apple Silicon a bundle that ends up
      # without even an ad-hoc signature won't launch at all — a worse failure than having no installer.
      # Adding it later is `vpk pack --plist <the templated Info.plist> --icon … --noInst` on the macOS leg;
      # --noInst matters (a root-owned .pkg install makes every future update prompt for a password, while a
      # user-owned .app dragged from a zip updates silently).
      #
      # The vpk tool version MUST match the Velopack PackageReference in Hoard.Desktop.csproj — bump both
      # together or the installed app and its updater disagree about the package format.
      - name: Install vpk
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Deltas are computed against the previous release's package, so pull it down first. Best-effort: the
      # first Velopack release (and every dry run) has nothing to fetch, which just means full-only updates
      # for that version rather than a failed build.
      #
      # It REPORTS whether it found a base, and that reporting is the point. By the time this runs,
      # release-please has already created the vX.Y.Z release — which has no Velopack assets yet, since this
      # job is what uploads them. If `vpk download` resolves that empty newest release instead of walking back
      # to the last one with a feed, it finds nothing, every single release silently ships full-only, and the
      # README's "updates download only what changed" quietly stops being true. A swallowed error that
      # degrades a feature forever must not be invisible, so the outcome lands in the run summary either way.
      - name: Fetch the previous release for delta generation
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" --outputDir Releases || true
          if compgen -G "Releases/*.nupkg" > /dev/null; then
            echo "Delta base found: $(ls Releases/*.nupkg | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ No delta base found — this release will ship FULL-ONLY update packages." >> "$GITHUB_STEP_SUMMARY"
          fi

      # --noPortable: we already ship one above, and two near-identical zips on the release page where only
      # one of them self-updates is a trap. Unsigned — see the note in README about the one-off SmartScreen
      # prompt; signing would slot in here as --signParams.
      - name: Pack the installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vpk pack \
            --packId Hoard \
            --packTitle Hoard \
            --packAuthors "Hoard contributors" \
            --packVersion "$VERSION" \
            --packDir out/Hoard \
            --mainExe Hoard.exe \
            --icon src/Hoard.Desktop/Assets/hoard.ico \
            --outputDir Releases \
            --noPortable

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="out/Hoard.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish/. "$APP/Contents/MacOS/"
          sed "s/__VERSION__/$VERSION/g" tools/packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          # Must land before codesign — adding a resource afterwards invalidates the signature.
          # The name has to match CFBundleIconFile in the plist.
          cp tools/packaging/macos/Hoard.icns "$APP/Contents/Resources/Hoard.icns"
          chmod +x "$APP/Contents/MacOS/Hoard"
          [[ -f "$APP/Contents/MacOS/tools/gallery-dl/gallery-dl" ]] && chmod +x "$APP/Contents/MacOS/tools/gallery-dl/gallery-dl"
          # Ad-hoc signature: enough for local Gatekeeper integrity checks.
          # Real Developer ID signing + notarisation needs Apple secrets — see
          # the workflow README note before adding them.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "Hoard-$VERSION-${{ matrix.rid }}.zip"

      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-Item "Hoard-$env:VERSION-${{ matrix.rid }}.zip"
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $($zip.Name)" |
            Out-File -Encoding ascii "$($zip.Name).sha256"

      - name: Checksum the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem Releases/*Setup.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" |
              Out-File -Encoding ascii "Releases/$($_.Name).sha256"
          }

      - name: Attest build provenance
        if: needs.release.outputs.release_created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Hoard-${{ env.VERSION }}-${{ matrix.rid }}.zip

      # The installer is what most people will actually run, so it gets provenance too. Its own step because
      # the packaging above is Windows-only.
      - name: Attest installer provenance
        if: runner.os == 'Windows' && needs.release.outputs.release_created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Releases/*Setup.exe

      - name: Upload release assets
        if: needs.release.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "Hoard-$VERSION-${{ matrix.rid }}.zip" \
            "Hoard-$VERSION-${{ matrix.rid }}.zip.sha256" \
            --clobber

      # The installer plus the update feed. releases.win.json is what an installed app reads to discover
      # this release, and the -full/-delta packages are what it downloads — a release missing any of them
      # simply never shows up as an update, silently. The previous version's full package is re-uploaded
      # unchanged (it's the base of the delta chain); --clobber makes that a no-op.
      - name: Upload installer assets
        if: runner.os == 'Windows' && needs.release.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Releases/*Setup.exe Releases/*Setup.exe.sha256 Releases/*.nupkg Releases/releases.*.json --clobber

      - name: Upload dry-run artifact
        if: needs.release.outputs.release_created != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hoard-${{ env.VERSION }}-${{ matrix.rid }}
          path: |
            Hoard-${{ env.VERSION }}-${{ matrix.rid }}.zip*
            Releases/*Setup.exe*
          retention-days: 7
