name: Release

# Versioning is automated from Conventional Commits; PUBLISHING IS NOT.
# Nothing is ever released as a side effect of pushing or merging — cutting a
# release is always a deliberate "Run workflow" click:
#  1. On every push to main, release-please works out the next semver from the
#     commit types since the last release (feat → minor, fix → patch,
#     feat!/BREAKING CHANGE → major; pre-1.0 the bumps are shifted down one
#     level) and keeps a "release PR" up to date with the version bump +
#     CHANGELOG.md. skip-github-release makes this step PR-only, so merging
#     that PR publishes nothing by itself — it just lands the version bump.
#  2. When you actually want to ship, run this workflow manually with
#     publish = true. release-please then creates the vX.Y.Z tag + GitHub
#     Release for the merged release commit (skip-github-pull-request, so this
#     leg never touches the PR), and the build matrix publishes the Windows x64
#     and Apple Silicon apps and uploads them (plus checksums + build
#     provenance) to that release.
# Order matters: merge the release PR first, then dispatch. Dispatching with no
# release commit waiting simply finds nothing to release and falls back to the
# dry run below.
#
# The build jobs chain off the release-please job (needs:) rather than
# triggering on the release event, because events created with the workflow's
# own GITHUB_TOKEN never start other workflows.
#
# A manual run with publish = false is a packaging dry run (artifacts only, no
# release), so packaging changes can be tested without cutting a version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Cut the release for the merged release PR and upload the builds. Off = packaging dry run (artifacts only)."
        type: boolean
        default: false

# Least privilege by default; each job asks for exactly what it needs.
permissions: {}

# Never run two release flows at once, and never cancel one mid-release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the tag + release
      pull-requests: write   # maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Push leg: keep the release PR current, and NEVER create a release —
      # that's what makes merging it safe rather than a publish trigger.
      - name: Update the release PR
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # Manual leg: tag + release the merged release commit. Outputs stay on the
      # `release` id, so everything downstream is unchanged; when this is skipped
      # (a push, or publish = false) they're empty and the build runs as a dry run.
      - name: Create the release
        id: release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build:
    needs: release-please
    # Only ever on a manual run: with a release cut it packages and uploads to it,
    # otherwise it's the dry run. A push can no longer reach this — nothing on the
    # push leg creates a release, which is the whole point.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      # Supported targets: Windows x64 and Apple Silicon. Intel macs (osx-x64) are deliberately NOT
      # released. Each RID is published on a runner of its own OS, which is what lets the packaging steps
      # and the gallery-dl fetch below pick the right per-OS binary by runner rather than by RID.
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write        # upload assets to the release
      id-token: write        # sign the provenance attestation
      attestations: write    # store the provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the released commit; empty ref = default branch on dry runs.
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Work out version
        shell: bash
        run: |
          if [[ -n "$TAG" ]]; then
            echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # Latest build on purpose — Pinterest changes break old gallery-dl builds
      # (see tools/fetch-gallery-dl.ps1). The zip checksum + provenance below
      # cover what was actually shipped.
      - name: Fetch gallery-dl
        shell: pwsh
        run: ./tools/fetch-gallery-dl.ps1

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Hoard.Desktop/Hoard.Desktop.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:Version="$VERSION" \
            -p:DebugType=embedded \
            --output publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Move-Item publish out/Hoard
          Compress-Archive -Path out/Hoard -DestinationPath "Hoard-$env:VERSION-${{ matrix.rid }}.zip"

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="out/Hoard.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish/. "$APP/Contents/MacOS/"
          sed "s/__VERSION__/$VERSION/g" tools/packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          # Must land before codesign — adding a resource afterwards invalidates the signature.
          # The name has to match CFBundleIconFile in the plist.
          cp tools/packaging/macos/Hoard.icns "$APP/Contents/Resources/Hoard.icns"
          chmod +x "$APP/Contents/MacOS/Hoard.Desktop"
          [[ -f "$APP/Contents/MacOS/tools/gallery-dl/gallery-dl" ]] && chmod +x "$APP/Contents/MacOS/tools/gallery-dl/gallery-dl"
          # Ad-hoc signature: enough for local Gatekeeper integrity checks.
          # Real Developer ID signing + notarisation needs Apple secrets — see
          # the workflow README note before adding them.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "Hoard-$VERSION-${{ matrix.rid }}.zip"

      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-Item "Hoard-$env:VERSION-${{ matrix.rid }}.zip"
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $($zip.Name)" |
            Out-File -Encoding ascii "$($zip.Name).sha256"

      - name: Attest build provenance
        if: needs.release-please.outputs.release_created == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: Hoard-${{ env.VERSION }}-${{ matrix.rid }}.zip

      - name: Upload release assets
        if: needs.release-please.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "Hoard-$VERSION-${{ matrix.rid }}.zip" \
            "Hoard-$VERSION-${{ matrix.rid }}.zip.sha256" \
            --clobber

      - name: Upload dry-run artifact
        if: needs.release-please.outputs.release_created != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hoard-${{ env.VERSION }}-${{ matrix.rid }}
          path: Hoard-${{ env.VERSION }}-${{ matrix.rid }}.zip*
          retention-days: 7
