name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# Supersede in-flight runs of the same PR — only the latest push to a PR is interesting. Everything
# else (a push to main, a dispatch) gets a group of its OWN, keyed by commit, so main runs never
# cancel or queue behind one another. That is load-bearing: release.yml chains off a main run's
# conclusion, and a run that never reaches 'success' drops the release silently.
#
# Isolating the group is the fix here; `cancel-in-progress: false` is NOT, and was the first attempt.
# It only protects a run already IN PROGRESS — GitHub cancels the previously PENDING run of a group
# whenever a newer one queues into it, whatever that flag says. With one shared main group, three
# merges in quick succession could therefore cancel the middle one while it sat pending, and if that
# was the release merge the release would vanish with no failure anywhere to explain it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hoard.slnx

      - name: Build
        run: dotnet build Hoard.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Hoard.slnx --no-build --configuration Release
